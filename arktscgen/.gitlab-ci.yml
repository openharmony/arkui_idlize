test arktscgen:
  allow_failure: true
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  script:
    - !reference [.npm, script]
    - !reference [.panda, script]
    - npm run all --prefix arktscgen

pack idlize-arktscgen:
  extends:
    - .npm-pack
  variables:
    PACKAGE_DIR: arktscgen
  needs:
    - build idlize

pre-publish test arktscgen:
  allow_failure: true
  stage: pre-publish
  needs:
  - build idlize
  tags:
    - idlize-ci
    - koala-ci
  script:
    - !reference [.npm, script]
    - !reference [.panda, script]
    - npm run test:pack --prefix arktscgen

publish idlize-arktscgen:
  extends:
    - .npm-publish
  variables:
    PACKAGE_DIR: arktscgen
  needs:
    - build idlize

