test arktscgen:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  # before_script:
  #   - npm i --prefix external/incremental --prefer-offline --no-audit --no-fund
  script:
    - !reference [.npm, script]
    - !reference [.panda, script]
    - npm run -C external sdk:all
    - npm run compile --prefix external/common
    - npm run compile --prefix external/compat
    - npm run compile --prefix external/interop
    - npm run compile --prefix external/fast-arktsc
    - npm run compile -C external/libarkts
    - npm run build:all -C external/ui2abc
    - npm run compile --prefix external/incremental/runtime
    - npm run build --prefix external/interop
    - npm run build --prefix external/incremental
    - npm run compile --prefix external/incremental/harness
    - npm run build --prefix external/incremental/harness
    - npm run test --prefix external/libarkts
    - npm run test:all --prefix external/ui2abc/memo-plugin-ng
  needs:
    - download external sdk

pack idlize-arktscgen:
  extends:
    - .npm-pack
  variables:
    PACKAGE_DIR: arktscgen
  needs:
    - build idlize

pre-publish test arktscgen:
  allow_failure: true
  stage: pre-publish
  needs:
  - build idlize
  tags:
    - idlize-ci
    - koala-ci
  script:
    - !reference [.npm, script]
    - !reference [.panda, script]
    - npm run test:pack --prefix arktscgen

publish idlize-arktscgen:
  extends:
    - .npm-publish
  variables:
    PACKAGE_DIR: arktscgen
  needs:
    - build idlize

