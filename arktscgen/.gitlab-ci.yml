test arktscgen:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  needs:
    - download koala_projects
  # before_script:
  #   - npm i --prefix external/incremental --prefer-offline --no-audit --no-fund
  script:
    - !reference [.npm, script]
    - npm i -C external/koala_projects --prefer-offline --no-audit --no-fund
    - npm run panda:sdk:install --prefix ./external/koala_projects/incremental/tools/panda
    - npm run -C external/koala_projects sdk:all
    - npm run compile --prefix external/koala_projects/common
    - npm run compile --prefix external/koala_projects/compat
    - npm run compile --prefix external/koala_projects/interop
    - npm run compile --prefix external/koala_projects/smart-arkts
    - npm run compile --prefix external/koala_projects/fast-arktsc
    - npm run compile -C external/koala_projects/libarkts
    - npm run build:all -C external/koala_projects/ui2abc
    - npm run compile --prefix external/koala_projects/incremental/runtime
    - npm run build --prefix external/koala_projects/interop
    - npm run build --prefix external/koala_projects/incremental
    - npm run compile --prefix external/koala_projects/incremental/harness
    - npm run build --prefix external/koala_projects/incremental/harness
    - npm run test --prefix external/koala_projects/libarkts
    - npm run test:all --prefix external/koala_projects/ui2abc/memo-plugin-ng

pack idlize-arktscgen:
  extends:
    - .npm-pack
  variables:
    PACKAGE_DIR: arktscgen
  needs:
    - build idlize

pre-publish test arktscgen:
  allow_failure: true
  stage: pre-publish
  needs:
  - build idlize
  tags:
    - idlize-ci
    - koala-ci
  script:
    - !reference [.npm, script]
    - npm run test:pack --prefix arktscgen

publish idlize-arktscgen:
  extends:
    - .npm-publish
  variables:
    PACKAGE_DIR: arktscgen
  needs:
    - build idlize

