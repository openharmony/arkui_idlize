build codecheck_fixer:
  stage: build
  interruptible: true
  tags:
    - idlize-ci
  needs: []
  before_script:
    - !reference [.npm, script]
  script:
    - cd codecheck_fixer
    - npm install
    - npm run build
  artifacts:
    paths:
      - codecheck_fixer/dist/
      - codecheck_fixer/node_modules/
    expire_in: 1 hour

test codecheck_fixer:
  stage: test
  interruptible: true
  tags:
    - idlize-ci
  needs:
    - build codecheck_fixer
  before_script:
    - !reference [.npm, script]
  script:
    - cd codecheck_fixer
    - npm test

