arkgen TS subset:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
    # - npm i --prefix external/incremental --prefer-offline --no-audit --no-fund
    # - npm i --prefix external/arkoala-arkts --prefer-offline --no-audit --no-fund
  script:
    - npm run -C arkgen setup:subset:ts
    - npm run -C arkgen gen-idl:subset:ts
    - npm run -C arkgen gen:subset:ts
    - npm run -C arkgen build:subset:ts
    - npm run -C arkgen build-native:subset:ts
    - npm run -C arkgen exec:subset:ts
  needs:
    - build idlize

