pg cj:run:
  allow_failure: true
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
    - cd $CI_PROJECT_DIR/arkgen
  script:
    - LD_LIBRARY_PATH=LD_LIBRARY_PATH=$CANGJIE_HOME/runtime/lib/linux_x86_64_llvm:$CANGJIE_HOME/tools/lib:$LD_LIBRARY_PATH npm run all:subset:cj

arkgen Kotlin subset:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    - npm run -C arkgen setup:subset:kt
    - npm run -C arkgen gen:kt:subset
    - npm run -C arkgen compile:kt:interop
    - npm run -C arkgen compile:kt:native:subset
    - npm run -C arkgen compile:kt:subset
    - npm run -C arkgen exec:kt:subset


build arkoala-ts:
  allow_failure: true
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
    - cd $CI_PROJECT_DIR/arkgen
  script:
    - npm run compile
    - KOALA_BZ=1 OPENLAB_USERNAME=koala-ci OPENLAB_PASSWORD=w1llUgu3ss npm run arkoala:ts

# Pack targets
pack idlize-arkgen:
  extends:
    - .npm-pack
  variables:
    PACKAGE_DIR: arkgen
  needs:
    - build idlize

pack idlize-core:
  extends:
    - .npm-pack
  variables:
    PACKAGE_DIR: core
  needs:
    - build idlize

pack idlize-linter:
  extends:
    - .npm-pack
  variables:
    PACKAGE_DIR: linter
  needs:
    - build idlize


# Publish targets
publish idlize-arkgen:
  extends:
    - .npm-publish
  variables:
    PACKAGE_DIR: arkgen
  needs:
    - build idlize

publish idlize-core:
  extends:
    - .npm-publish
  variables:
    PACKAGE_DIR: core
  needs:
    - build idlize

publish idlize-linter:
  extends:
    - .npm-publish
  variables:
    PACKAGE_DIR: linter
  needs:
    - build idlize



