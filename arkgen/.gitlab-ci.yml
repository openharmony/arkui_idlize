arkgen TS subset:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
  script:
    - npm run -C arkgen setup:subset:ts
    - npm run -C arkgen gen-idl:subset:ts
    - npm run -C arkgen gen:subset:ts
    - npm run -C arkgen build:subset:ts
    - npm run -C arkgen build-native:subset:ts
    - npm run -C arkgen exec:subset:ts
  needs:
    - build idlize

arkgen ArkTS subset:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    - npm run -C arkgen setup:subset:arkts
    - npm run -C arkgen gen-idl:subset:arkts
    - npm run -C arkgen gen:subset:arkts
    - npm run -C arkgen build:subset:arkts
    - npm run -C arkgen build-native:subset:arkts
    - npm run -C arkgen/tests-template/arkts build
    - npm run -C arkgen exec:subset:arkts
  needs:
    - build idlize
    - build external

<ArkTS> koala-projects integration test:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  needs:
    - build idlize
    - build external
    - download external sdk
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    # Bundle idlizer
    - npm run bundle:idlizer --prefix external/arkoala-arkts/tools/idlizer-bundler
    # Build
    - npm run build --prefix external/arkoala-arkts/arkui
    - npm run compile:native:node-host --prefix external/arkoala-arkts
    # Verify the outputs
    - ls -l external/arkoala-arkts/arkui/build/arkui.abc
    - ls -l external/arkoala-arkts/framework/native/build-node-host-vmloader/ArkoalaLoader.node
    - ls -l external/arkoala-arkts/framework/native/build-panda-host/libArkoalaNative_linux_x64_ani.so


arkgen ArkTS unit:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    - npm run -C arkgen/tests-template/arkts build
    - npm run -C arkgen/tests/unit init:arkts
    - npm run -C arkgen/tests/unit gen:arkts
    - npm run -C arkgen/tests/unit build:arkts
    - npm run -C arkgen/tests/unit build:arkts:native
    - npm run -C arkgen/tests/unit exec:arkts
    - npm run -C arkgen/tests/unit gen:golden
    - npm run -C arkgen/tests/unit exec:golden
  needs:
    - build idlize

arkgen Kotlin unit:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    - npm run -C arkgen/tests/unit init:kt
