include:
    - gitlab/npm.yml

build idlize:
    stage: build
    tags:
    - idlize-ci
    - koala-ci
    # before_script:
    # - npm i --prefix external/incremental --prefer-offline --no-audit --no-fund
    script:
    - !reference [.npm, script]
    - gn gen out/dir
    - ninja -C out/dir -j 20 arkgen:compile arktscgen:compile core:compile ost:compile kit:compile libohos:compile idlinter:compile dtsgen:compile etsgen:compile ohosgen:compile runner:compile
    cache:
    -   key: $CI_PIPELINE_ID
        policy: pull-push
        paths:
        - .npm/
    artifacts:
        paths:
        - arkgen/build
        - arkgen/lib
        - arktscgen/lib
        - core/build
        - ost/build
        - dtsgen/build
        - dtsgen/lib
        - etsgen/build
        - etsgen/lib
        - idlinter/build
        - idlinter/dist
        - libohos/build
        - linter/lib
        - ohosgen/build
        - ohosgen/lib
        - runner/lib
