ohosgen XML demo:
    stage: test
    tags:
      - idlize-ci
      - koala-ci
    needs:
    - build idlize
    before_script:
      - !reference [.npm, script]
      - !reference [.panda, script]
    script:
      - cd $CI_PROJECT_DIR/ohosgen/demos/xml
      - npm run all:ts
      - npm run all:arkts
      - cd $CI_PROJECT_DIR/external/arkoala-arkts
      - npm i
      - cd $CI_PROJECT_DIR/ohosgen/demos/xml
      - npm run all:kt

ohosgen unit tests:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  needs:
    - build idlize
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    - cd $CI_PROJECT_DIR/ohosgen/tests/unit
    - npm run all:ts
    - npm run all:arkts
    - npm run all:kt
    - cd $CI_PROJECT_DIR/ohosgen/tests/dummy
    - npm run all:ts
    - npm run all:arkts
  # after_script:
  #   - !reference [.notify-telegram, script]

ohosgen demos:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  needs:
  - build idlize
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    - cd $CI_PROJECT_DIR/ohosgen/demos/mediaquery
    - npm show @koalaui/interop && npm show @koalaui/common
    - npm run all:ts
    - npm run all:arkts
    - cd $CI_PROJECT_DIR/ohosgen/demos/context
#   - npm run all:ts
    - npm run all:arkts
    - cd $CI_PROJECT_DIR/ohosgen/demos/huks
    - npm run all:ts
    - npm run all:arkts

ohosgen system tests:
  stage: test
  tags:
    - idlize-ci
    - koala-ci
  needs:
    - build idlize
  before_script:
    - !reference [.npm, script]
    - !reference [.panda, script]
  script:
    - cd $CI_PROJECT_DIR/ohosgen/tests/system
    - npm i -d
    - python3 run-system-tests.py
