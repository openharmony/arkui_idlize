ohosgen XML demo:
    stage: test
    tags:
      - idlize-ci
      - koala-ci
    needs:
    - build idlize
    before_script:
      - !reference [.npm, script]
    script:
      - cd $CI_PROJECT_DIR/ohosgen/demos/xml
      - npm run all:ts
      - npm run all:arkts

